name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core physics tests
        run: node test/core.test.js
      - name: Tree flattening tests
        run: node test/treepack.test.js
      - name: Stellar evolution tests
        run: node test/evolution.test.js
      - name: Scenario smoke test
        run: node test/smoke.js
