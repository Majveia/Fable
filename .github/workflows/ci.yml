name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core physics tests
        run: node test/core.test.js
      - name: Tree flattening tests
        run: node test/treepack.test.js
      - name: Stellar evolution tests
        run: node test/evolution.test.js
      - name: Cosmos generation + aging tests
        run: node test/cosmos.test.js
      - name: Navigator (floating origin + LOD) tests
        run: node test/navigator.test.js
      - name: Persistence (aging clock) tests
        run: node test/persist.test.js
      - name: DRIFTER lore (procedural text) tests
        run: node test/lore.test.js
      - name: DRIFTER points-of-interest tests
        run: node test/poi.test.js
      - name: DRIFTER ship flight-model tests
        run: node test/ship.test.js
      - name: DRIFTER landmarks (merged sandboxes) tests
        run: node test/landmarks.test.js
      - name: DRIFTER game-state tests
        run: node test/drifter.test.js
      - name: WANDERER ship-model tests
        run: node test/shipmodel.test.js
      - name: WANDERER avatar tests
        run: node test/avatar.test.js
      - name: Scenario smoke test
        run: node test/smoke.js

  gpu-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y > /dev/null
          npm install playwright@1.56.1 > /dev/null
          npx playwright install --with-deps chromium
      - name: GPU engine in headless Chromium
        run: node test/gpu.browser.test.js
      - name: Persistent universe fly-through in headless Chromium
        run: node test/cosmos.browser.test.js
      - name: DRIFTER playable loop in headless Chromium
        run: node test/drifter.browser.test.js
      - name: WANDERER walk + fly (FP/TP) in headless Chromium
        run: node test/wanderer.browser.test.js

  webgpu-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y > /dev/null
          npm install playwright@1.56.1 > /dev/null
          npx playwright install --with-deps chromium
      - name: WebGPU engine (self-skips without an adapter)
        run: node test/wgpu.browser.test.js
      - name: Black-screen insurance (all WebGPU failure modes)
        run: node test/fallback.browser.test.js
