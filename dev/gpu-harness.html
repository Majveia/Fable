<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>PhysicsGPU harness</title></head>
<body>
<canvas id="c" width="64" height="64"></canvas>
<script src="../js/core/bodies.js"></script>
<script src="../js/core/octree.js"></script>
<script src="../js/core/treepack.js"></script>
<script src="../js/core/physics.js"></script>
<script src="../js/core/physics-gpu.js"></script>
<script>
// Headless accuracy probe: a circular two-body orbit integrated by the
// REAL GPU engine must stay circular; then a remnant burst and a
// runtime black hole must not break anything. Result on window.__result.
(async () => {
  const out = { ok: false, log: [] };
  try {
    const gl = document.getElementById('c').getContext('webgl2');
    if (!PhysicsGPU.init(gl, { maxBodies: 1 << 16 })) {
      throw new Error('PhysicsGPU.init failed (no EXT_color_buffer_float?)');
    }
    DarkMatter.on = false;                  // pure two-body Kepler test
    Object.assign(PhysicsGPU.cfg, {
      dt: 0.05, substeps: 1, softening: 0.5, captureRadius: 0.5,
      timeScale: 1, paused: false, t: 0,
    });

    const M = 50000, R = 200;
    const v = Math.sqrt(M / R);
    Bodies.clear();
    Bodies.add(0, 0, 0, 0, 0, 0, M, 5, 7, Bodies.TYPE_STAR, 'sun');
    Bodies.add(R, 0, 0, 0, 0, v, 1, 1, 2, Bodies.TYPE_PLANET, 'p');
    // a few tracers so the tracer path runs too
    for (let i = 0; i < 100; i++) {
      const a = Math.random() * 2 * Math.PI;
      const r = 300 + Math.random() * 50;
      const vv = Math.sqrt(M / r);
      Bodies.add(r * Math.cos(a), 0, r * Math.sin(a),
                 -vv * Math.sin(a), 0, vv * Math.cos(a),
                 0.001, 0.5, 5, Bodies.TYPE_DUST, null);
    }
    PhysicsGPU.upload();

    // ~2 orbital periods (T = 2πR/v ≈ 79.5, dt 0.05 → 1590 steps/orbit)
    for (let s = 0; s < 3200; s++) PhysicsGPU.frame();
    // let the async mirror catch up
    PhysicsGPU.cfg.paused = false;
    for (let s = 0; s < 3; s++) PhysicsGPU.frame();

    const dx = Bodies.px[1] - Bodies.px[0];
    const dy = Bodies.py[1] - Bodies.py[0];
    const dz = Bodies.pz[1] - Bodies.pz[0];
    const r = Math.hypot(dx, dy, dz);
    out.radErr = Math.abs(r - R) / R;
    out.finite = isFinite(r);
    out.log.push(`orbit radius ${r.toFixed(2)} vs ${R} (err ${(out.radErr * 100).toFixed(2)}%)`);

    PhysicsGPU.addBurst(0, 0, 0, 0, 0, 0, 64);
    const slot = PhysicsGPU.addMassive(400, 0, 0, 0, 0, 0, 6000, 3, 8, Bodies.TYPE_BH);
    for (let s = 0; s < 10; s++) PhysicsGPU.frame();
    out.burstOk = true;
    out.bhSlot = slot;
    out.log.push(`burst + runtime BH ok (slot ${slot})`);

    out.ok = out.finite && out.radErr < 0.05 && slot >= 0;
  } catch (e) {
    out.error = e.message;
  }
  window.__result = out;
})();
</script>
</body>
</html>
